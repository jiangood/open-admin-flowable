# 流程定义列表
definitions:
  - key: "leave_request"
    name: "请假流程"
    listener: io.github.jiangood.openadmin.modules.flowable.example.LeaveProcessListener

    variables:
      - name: "reason"
        label: "请假事由"
        required: true
      - name: "days"
        label: "申请天数"
        value-type: number
        required: true
      - name: "actualDays"
        label: "实际批假天数"
        value-type: number
        required: true
      - name: "leaveType"
        label: "请假类型"
        required: true

    # 流程中各个节点对应的表单定义
    forms:
      - key: "start_form"
        label: "请假申请表"
      - key: "manager_approve_form"
        label: "经理审批表"
      - key: "finish_view"
        label: "流程结果查看"
