server:
  port: 8082
  servlet:
    context-path: /process

spring:
  config:
    import: classpath:application-lib.yml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/open-admin-process?allowPublicKeyRetrieval=true&autoReconnect=true&useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=CONVERT_TO_NULL&useSSL=false&nullCatalogMeansCurrent=true
    username: root
    password: 123456  # 生产环境请通过 SPRING_DATASOURCE_PASSWORD 环境变量覆盖
  jpa:
    generate-ddl: true
    show-sql: true

sys:
  title: 流程引擎测试
  captcha-enable: false

db_ip: 127.0.0.1
db_port: 3306
db_database: open-admin-process
db_username: root
db_password: 123456  # 生产环境请通过环境变量覆盖

flowable:
  reject-type: DELETE